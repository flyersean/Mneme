<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mneme — Overview</title>
<style>
  :root { --fg:#1a1a1a; --muted:#6b7280; --bg:#ffffff; --panel:#f7f7f8; --line:#e5e7eb; --accent:#2563eb; --green:#16a34a; --red:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:18px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; font-weight:650; }
  .toolbar { display:flex; gap:10px; align-items:center; }
  main { padding:24px 28px; max-width:1180px; margin:0 auto; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .badge.up { background:#ecfdf5; color:var(--green); border:1px solid #bbf7d0; }
  .badge.down { background:#fef2f2; color:var(--red); border:1px solid #fecaca; }
  .model { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; word-break:break-all; }
  .links a { margin-right:9px; color:var(--accent); text-decoration:none; font-size:13px; white-space:nowrap; }
  .links a:hover { text-decoration:underline; }
  button { font:inherit; font-size:13px; padding:5px 12px; border:1px solid var(--line); border-radius:7px; background:var(--bg); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.start { color:var(--green); }
  button.start:hover { border-color:var(--green); }
  button.stop { color:var(--red); margin-left:6px; }
  button.stop:hover { border-color:var(--red); }
</style>
</head>
<body>
<header>
  <h1>Mneme — Overview</h1>
  <div class="toolbar">
    <button onclick="load()">Refresh</button>
  </div>
</header>
<main>
  <p class="hint">Overview of every proxy on this pod. Click through to any instance's pages — the gateway routes <code>/&lt;port&gt;/…</code> to that instance.</p>
  <table>
    <thead>
      <tr><th>Port</th><th>Model</th><th>Backend</th><th>Status</th><th>Pages</th><th>Actions</th></tr>
    </thead>
    <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
  </table>
</main>
<script>
const PAGES = [['Dashboard','/'],['Chat','/chat'],['Memory','/memory'],['Instructions','/instructions'],['Templates','/templates'],['Ollama','/ollama']];

async function load() {
  const rows = document.getElementById('rows');
  try {
    const r = await fetch('/gateway/instances');
    const j = await r.json();
    const list = j.instances || [];
    if (!list.length) { rows.innerHTML = '<tr><td colspan="6">No instances found.</td></tr>'; return; }
    rows.innerHTML = '';
    for (const it of list) {
      const base = it.base || ('/' + it.port);
      const links = PAGES.map(([label, path]) => `<a href="${base}${path}">${label}</a>`).join('');
      const badge = it.running ? '<span class="badge up">running</span>' : '<span class="badge down">stopped</span>';
      const actions = it.running
        ? `<button class="stop" onclick="act('stop',${it.port})">Stop</button>`
        : `<button class="start" onclick="act('start',${it.port})">Start</button>`;
      rows.insertAdjacentHTML('beforeend',
        `<tr><td>${it.port}</td><td class="model">${it.model}</td><td>${it.backend}</td><td>${badge}</td><td class="links">${links}</td><td>${actions}</td></tr>`);
    }
  } catch (e) {
    rows.innerHTML = `<tr><td colspan="6">Error: ${e.message}</td></tr>`;
  }
}

async function act(action, port) {
  try {
    const r = await fetch('/overview/' + action, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({port})});
    const j = await r.json();
    if (j.error) { alert(j.error); }
    setTimeout(load, 800);
  } catch (e) { alert(e.message); }
}

load();
</script>
</body>
</html>
