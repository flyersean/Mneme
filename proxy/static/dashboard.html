<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mneme</title>
<style>
  :root { --fg:#1a1a1a; --muted:#6b7280; --bg:#ffffff; --panel:#f7f7f8; --line:#e5e7eb; --accent:#2563eb; --accent-soft:#eff6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:20px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:20px; font-weight:650; }
  main { padding:24px 28px; max-width:960px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; transition:border-color .12s; }
  a.card:hover { border-color:var(--accent); }
  a.card h2 { margin:0 0 6px; font-size:16px; font-weight:600; }
  a.card p { margin:0; color:var(--muted); font-size:13px; line-height:1.4; }
  section { margin-top:28px; }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; }
  .status { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .row:last-child { border-bottom:none; }
  .row .k { color:var(--muted); }
  .row .v { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  button { font:inherit; font-size:14px; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:var(--bg); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #reloadMsg { margin-left:10px; font-size:13px; color:var(--muted); }
  .actions { display:flex; gap:10px; align-items:center; }
</style>
</head>
<body>
<header>
  <h1>Mneme</h1>
  <div class="actions">
    <button id="reloadBtn">Reload config</button>
    <span id="reloadMsg"></span>
  </div>
</header>
<main>
  <section>
    <h3>Pages</h3>
    <div class="grid">
      <a class="card" href="/chat"><h2>Chat</h2><p>Talk to the model.</p></a>
      <a class="card" href="/memory"><h2>Memory</h2><p>Review, retract and manage chunks.</p></a>
      <a class="card" href="/instructions"><h2>Instructions</h2><p>Edit the injected prompts.</p></a>
      <a class="card" href="/templates"><h2>Templates</h2><p>Manage model templates &amp; Modelfiles.</p></a>
    </div>
  </section>
  <section>
    <h3>Status</h3>
    <div class="status" id="status">Loading…</div>
  </section>
</main>
<script>
async function loadStatus() {
  try {
    const r = await fetch('/dashboard/status');
    const s = await r.json();
    const m = s.model || {}, st = s.storage || {};
    const rows = [
      ['model', m.model || '?'],
      ['backend', m.backend || '?'],
      ['template', m.template || '(none)'],
      ['chunks', s.chunks != null ? s.chunks : '?'],
      ['memory_enabled', st.memory_enabled != null ? st.memory_enabled : '?'],
      ['memory_only', st.memory_only != null ? st.memory_only : '?'],
      ['hot_reload', m.hot_reload || '?'],
      ['db_path', st.db_path || '?'],
      ['chunk_dir', st.chunk_dir || '?'],
    ];
    document.getElementById('status').innerHTML = rows.map(([k,v]) =>
      `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  } catch (e) {
    document.getElementById('status').textContent = 'Could not load status: ' + e;
  }
}
document.getElementById('reloadBtn').addEventListener('click', async () => {
  const msg = document.getElementById('reloadMsg');
  msg.textContent = 'reloading…';
  try {
    const r = await fetch('/admin/reload', { method:'POST' });
    const j = await r.json();
    msg.textContent = j.ok ? 'done' : 'failed';
    if (j.ok) loadStatus();
  } catch (e) { msg.textContent = 'error: ' + e; }
});
loadStatus();
</script>
</body>
</html>
