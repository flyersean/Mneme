<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mneme — Chat</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --assistant-bubble: #ffffff;
    --code-bg: #f3f4f6;
    --tool-bg: #f8fafc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .title { font-weight: 600; font-size: 16px; }
  header .model { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  header button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  header button:hover { background: var(--accent-soft); border-color: var(--accent); }
  header #settings-btn { font-size: 16px; padding: 6px 10px; }

  /* settings popover */
  #settings {
    position: absolute;
    top: 52px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
    padding: 12px 14px;
    font-size: 14px;
    display: none;
    z-index: 10;
    min-width: 200px;
  }
  #settings.open { display: block; }
  #settings label { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
  #settings input[type=checkbox] { accent-color: var(--accent); }
  #settings .heading { font-weight: 600; margin-bottom: 4px; color: var(--text); }

  #convs-panel {
    position: absolute;
    top: 52px;
    right: 120px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
    padding: 12px 14px;
    font-size: 13px;
    display: none;
    z-index: 10;
    min-width: 260px;
    max-height: 60vh;
    overflow-y: auto;
  }
  #convs-panel.open { display: block; }
  #convs-panel .heading { font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .conv-item { display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; cursor: pointer; }
  .conv-item:hover { background: var(--accent-soft); }
  .conv-item.active { background: var(--accent-soft); }
  .conv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .conv-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-time { color: var(--muted); font-size: 10px; }
  .conv-del { flex-shrink: 0; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 3px 5px; border-radius: 5px; }
  .conv-del:hover { color: var(--red, #dc2626); background: rgba(220,38,38,.10); }
  .conv-empty { color: var(--muted); font-size: 12px; padding: 6px 2px; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .inner { max-width: 760px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 14px; }

  /* command sidebar */
  #layout { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 236px; flex-shrink: 0;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
    transition: width .15s ease;
  }
  #sidebar.collapsed { width: 46px; }
  .sb-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .sb-title { font-weight: 600; font-size: 13px; white-space: nowrap; }
  #sb-toggle { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; cursor: pointer; padding: 1px 9px; font-size: 14px; line-height: 1.4; }
  #sb-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sb-runid { display: flex; flex-direction: column; gap: 3px; padding: 8px 12px 4px; border-bottom: 1px solid var(--border); }
  .sb-runid-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #runid-field { width: 100%; box-sizing: border-box; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); }
  #runid-field:focus { outline: none; border-color: var(--accent); }
  #sidebar.collapsed .sb-runid { display: none; }
  .sb-cmds { flex: 1 1 42%; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .sb-cmd {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    border: none; background: transparent; text-align: left;
    padding: 6px 8px; border-radius: 7px; cursor: pointer; width: 100%; font: inherit;
  }
  .sb-cmd:hover { background: var(--accent-soft); }
  .sb-name { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; color: var(--accent); font-size: 13px; white-space: nowrap; }
  .sb-desc { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #sidebar.collapsed .sb-title, #sidebar.collapsed .sb-desc { display: none; }
  #sidebar.collapsed .sb-cmd { align-items: center; padding: 7px 4px; }
  #sidebar.collapsed .sb-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }

  /* file browser section */
  .sb-sep { height: 1px; background: var(--border); margin: 4px 10px; flex-shrink: 0; }
  .sb-filehead { display: flex; align-items: center; gap: 4px; padding: 4px 10px; font-weight: 600; font-size: 12px; flex-shrink: 0; }
  .sb-filehead span { flex: 1; }
  .sb-filehead button { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 5px; cursor: pointer; padding: 1px 7px; font-size: 12px; line-height: 1.4; }
  .sb-filehead button:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sb-filepath { padding: 0 10px 4px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .sb-files { flex: 1 1 58%; overflow-y: auto; padding: 2px 6px 6px; display: flex; flex-direction: column; gap: 1px; }
  .fb-item { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .fb-item:hover { background: var(--accent-soft); }
  .fb-ico { width: 14px; text-align: center; flex-shrink: 0; }
  .fb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .fb-badge { font-size: 9px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; flex-shrink: 0; }
  .fb-item.out .fb-name { color: var(--muted); }
  .fb-empty { color: var(--muted); font-size: 11px; padding: 4px 8px; }
  #sidebar.collapsed .sb-filehead, #sidebar.collapsed .sb-filepath, #sidebar.collapsed .sb-files { display: none; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* run activity card */
  .runcard { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); width: 100%; }
  .rc-head { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .rc-id { font-family: "SF Mono", Menlo, Consolas, monospace; color: var(--accent); font-weight: 600; }
  .rc-status { color: var(--muted); }
  .rc-status.rc-completed { color: #16a34a; }
  .rc-status.rc-failed, .rc-status.rc-cancelled { color: #dc2626; }
  .rc-body { padding: 6px 10px 8px; max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .rc-line { font-size: 12px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-line.rc-task { font-weight: 600; white-space: normal; }
  .rc-task-item { color: var(--muted); white-space: normal; font-size: 11px; }
  .rc-line.rc-ok { color: #16a34a; }
  .rc-line.rc-fail { color: #dc2626; }
  .rc-toolres summary { cursor: pointer; color: var(--muted); font-size: 11px; }
  .rc-res { white-space: pre-wrap; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); max-height: 200px; overflow-y: auto; margin-top: 2px; padding: 4px 6px; background: var(--bg); border-radius: 5px; }
  .rc-thinking { margin-top: 2px; }
  .rc-thinking summary { cursor: pointer; color: var(--muted); font-size: 11px; }
  .rc-thinking-body { white-space: pre-wrap; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); max-height: 200px; overflow-y: auto; margin-top: 2px; padding: 4px 6px; background: var(--bg); border-radius: 5px; }
  .rc-narration { font-size: 12px; line-height: 1.5; color: var(--text); white-space: pre-wrap; padding: 2px 0; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .row.assistant .bubble { background: var(--assistant-bubble); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  .bubble code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .row.user .bubble code { background: rgba(255,255,255,0.22); }
  .bubble pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    margin: 8px 0;
  }
  .row.user .bubble pre { background: rgba(255,255,255,0.18); }

  .thinking { color: var(--muted); font-style: italic; font-size: 14px; padding: 8px 4px; }
  .thinking .dot { animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

  details.reasoning { margin: 4px 0; }
  details.reasoning summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.reasoning .body { color: var(--muted); font-size: 13px; white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 10px; margin-top: 6px; }

  /* tool-call trace */
  .toolcalls {
    display: flex; flex-direction: column; gap: 6px;
    max-width: 760px; margin: 0 auto; width: 100%;
  }
  .toolcall {
    background: var(--tool-bg);
    border: 1px solid var(--border);
    border-left: 3px solid #9ca3af;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .toolcall.blocked { border-left-color: #dc2626; }
  .toolcall summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
    color: var(--text);
  }
  .toolcall summary::-webkit-details-marker { display: none; }
  .toolcall .tname {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 1px 7px;
    border-radius: 5px;
  }
  .toolcall.blocked .tname { color: #dc2626; background: #fef2f2; }
  .toolcall .targs { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolcall .ttime { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .toolcall .tbody {
    margin-top: 6px;
    padding: 6px 8px;
    background: var(--code-bg);
    border-radius: 6px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }

  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 160px;
    outline: none;
    background: var(--panel);
    color: var(--text);
  }
  textarea:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #send:hover { background: #1d4ed8; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  #send.stop { background: #dc2626; }
  #send.stop:hover { background: #b91c1c; }
</style>
<style>
.mneme-nav{display:flex;flex-wrap:wrap;gap:6px;padding:8px 24px;margin:0 0 4px 0}
.mneme-nav a{padding:5px 12px;border-radius:7px;text-decoration:none;color:#4b5563;font-size:13px;background:#f9fafb;border:1px solid #e5e7eb}
.mneme-nav a:hover{border-color:#2563eb;color:#2563eb}
.mneme-nav a.active{background:#2563eb;color:#fff;border-color:#2563eb}
</style>
<style>
/* harness panel + / command palette */
#harness-panel {
  position: absolute; top: 52px; right: 20px;
  width: 380px; max-width: calc(100vw - 40px); max-height: 74vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 14px 16px; font-size: 13px;
  display: none; z-index: 20; text-align: left;
}
#harness-panel.open { display: block; }
#harness-panel h3 { margin: 0 0 8px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
#harness-runs { display: flex; flex-direction: column; gap: 2px; }
.run-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; text-decoration: none; color: var(--text); }
.run-item:hover { background: var(--accent-soft); }
.run-item .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.badge.s-completed { background: #dcfce7; color: #15803d; }
.badge.s-failed, .badge.s-cancelled { background: #fee2e2; color: #b91c1c; }
.badge.s-running, .badge.s-planning, .badge.s-verifying { background: #dbeafe; color: #1d4ed8; }
.badge.s-paused, .badge.s-awaiting_approval { background: #fef3c7; color: #b45309; }
.run-item .rgoal { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-item .rtime { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
#harness-cmds { display: flex; flex-direction: column; gap: 1px; }
.cmd-line { display: flex; gap: 8px; align-items: baseline; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.cmd-line:hover { background: var(--accent-soft); }
.cmd-line .cname { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; color: var(--accent); white-space: nowrap; }
.cmd-line .cdesc { color: var(--muted); font-size: 12px; }
.harness-foot { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
.harness-foot a { color: var(--accent); text-decoration: none; font-size: 12px; }
#harness-panel input, #harness-panel button { font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 7px; }
#harness-panel input { flex: 1; outline: none; background: var(--panel); color: var(--text); }
#harness-panel input:focus { border-color: var(--accent); }
#harness-panel button { cursor: pointer; background: var(--panel); color: var(--text); }
#harness-panel button:hover { border-color: var(--accent); background: var(--accent-soft); }

.palette {
  position: fixed; z-index: 30; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.16);
  max-width: 460px; max-height: 320px; overflow-y: auto; padding: 4px; display: none;
}
.palette.open { display: block; }
.cmd-item { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 7px; cursor: pointer; }
.cmd-item:hover, .cmd-item.sel { background: var(--accent-soft); }
.cmd-item .cname { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; color: var(--accent); white-space: nowrap; }
.cmd-item .cdesc { color: var(--muted); font-size: 12px; }
/* ── model picker (provider/model switcher) ── */
header .model { cursor: pointer; user-select: none; }
header .model:hover { color: var(--accent); }
#model-picker { width: 440px; }
.mp-search { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 4px; background: var(--panel); color: var(--text); font: inherit; font-size: 13px; outline: none; }
.mp-search:focus { border-color: var(--accent); }
.mp-cur { padding: 2px 10px 6px; color: var(--muted); font-size: 11px; }
.mp-provider { padding: 5px 10px 3px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }
.mp-item { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 10px; border-radius: 7px; cursor: pointer; }
.mp-item:hover { background: var(--accent-soft); }
.mp-item .mp-id { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
.mp-item .mp-ctx { color: var(--muted); font-size: 11px; white-space: nowrap; }
.mp-empty { padding: 12px 10px; color: var(--muted); font-size: 13px; }
.model-row { display: flex; align-items: center; gap: 8px; }
#model-btn { font: inherit; font-size: 11px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--accent); cursor: pointer; }
#model-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.mp-providers { border-bottom: 1px solid var(--border); margin-bottom: 4px; padding-bottom: 4px; }
.mp-prov { display: flex; gap: 8px; align-items: center; padding: 5px 10px; font-size: 12px; }
.mp-prov-name { font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; }
.mp-prov-model { color: var(--muted); font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
.mp-prov-key { margin-left: auto; }
.mp-setkey { color: var(--accent); cursor: pointer; text-decoration: underline; }
.mp-custom { display: flex; gap: 6px; padding: 4px 10px 6px; }
.mp-custom-input { flex: 1; min-width: 0; padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; font-size: 13px; outline: none; }
.mp-custom-input:focus { border-color: var(--accent); }
.mp-custom-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--accent); cursor: pointer; font: inherit; font-size: 13px; }
.mp-custom-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
#key-dialog { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; }
#key-dialog.open { display: flex; }
.kd-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; width: 360px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.kd-title { font-weight: 600; margin-bottom: 10px; }
.kd-input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--text); font: inherit; font-size: 13px; outline: none; margin-bottom: 12px; }
.kd-input:focus { border-color: var(--accent); }
.kd-actions { display: flex; gap: 8px; justify-content: flex-end; }
.kd-actions button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--text); cursor: pointer; font: inherit; font-size: 13px; }
.kd-actions .kd-save { background: var(--accent); color: #fff; border-color: var(--accent); }
.mp-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px 4px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.mp-back { color: var(--accent); cursor: pointer; text-decoration: none; text-transform: none; letter-spacing: 0; font-weight: 600; }
.mp-back:hover { text-decoration: underline; }
.mp-key-btn { margin-left: auto; padding: 3px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--accent); cursor: pointer; font: inherit; font-size: 11px; font-weight: 600; }
.mp-key-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.mp-provider-list .mp-prov { cursor: pointer; border-radius: 7px; }
.mp-provider-list .mp-prov:hover { background: var(--accent-soft); }
.mp-provider-list .mp-prov.cur { background: var(--accent-soft); }
.mp-prov .mp-prov-kind { color: var(--muted); font-size: 11px; }
.mp-prov .mp-prov-key { color: var(--muted); font-size: 11px; }
.mp-prov .mp-prov-key.mp-setkey-link { color: var(--accent); cursor: pointer; }
.mp-prov .mp-prov-key.mp-setkey-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div>
    <div class="title">Mneme</div>
    <div class="model-row">

<div id="settings">
  <div class="heading">Display</div>

  <label><input type="checkbox" id="opt-tools" checked> Show tool calls</label>

</div>

    <input id="hrun-goal" placeholder="Goal — the model plans the tasks">

  </div>

<div id="layout">
  <aside id="sidebar">

    <div class="sb-runid">

      <input id="runid-field" placeholder="paste run_… id" spellcheck="false" autocomplete="off">
    </div>

  </aside>

    <div id="chat"><div class="inner" id="thread"></div></div>

        <textarea id="input" rows="1" placeholder="Ask something… (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="send">Send</button>
      </div>

<script>
const MODEL = "text-mneme:64k";
const thread = document.getElementById("thread");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const modelLabel = document.getElementById("model-label");
const chat = document.getElementById("chat");
const settingsPanel = document.getElementById("settings");
const convsPanel = document.getElementById("convs-panel");
const convsBtn = document.getElementById("convs-btn");
const optThinking = document.getElementById("opt-thinking");
const optTools = document.getElementById("opt-tools");

let history = [];   // [{role, content}]
let convId = null;  // current conversation id (persistent chat)
let busy = false;
let controller = null;   // AbortController for the in-flight turn

// persisted display settings
function loadSetting(key, def) {
  try { const v = localStorage.getItem(key); return v === null ? def : v === "1"; }
  catch (e) { return def; }
}
function saveSetting(key, val) { try { localStorage.setItem(key, val ? "1" : "0"); } catch (e) {} }
optThinking.checked = loadSetting("mneme.showThinking", true);
optTools.checked = loadSetting("mneme.showTools", true);
optThinking.addEventListener("change", () => saveSetting("mneme.showThinking", optThinking.checked));
optTools.addEventListener("change", () => saveSetting("mneme.showTools", optTools.checked));

// ── helpers ──────────────────────────────────────────────────────
function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Minimal markdown: escape HTML, then ```blocks```, `inline`, **bold**.
function renderMarkdown(src) {
  const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const parts = String(src).split(/```/);
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      const code = parts[i].replace(/^[a-zA-Z0-9_+-]*\n/, "");
      html += "<pre>" + escapeHtml(code) + "</pre>";
    } else {
      html += escapeHtml(parts[i])
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }
  }
  return html;
}

function argsSummary(args) {
  if (!args) return "";
  const parts = [];
  for (const [k, v] of Object.entries(args)) {
    if (v === null || v === undefined || v === "") continue;
    const s = String(v);
    parts.push(k + "=" + (s.length > 60 ? s.slice(0, 60) + "…" : s));
  }
  return parts.join("  ");
}

function appendMessage(role, content, reasoning) {
  const row = el("div", "row " + role);
  const bubble = el("div", "bubble");
  bubble.innerHTML = renderMarkdown(content);
  row.appendChild(bubble);
  thread.appendChild(row);

  if (reasoning && reasoning.trim() && optThinking.checked) {
    const det = el("details", "reasoning");
    const sum = el("summary", null, "thinking");
    const body = el("div", "body", reasoning.trim());
    det.appendChild(sum); det.appendChild(body);
    const rrow = el("div", "row assistant");
    const wrap = el("div", "bubble");
    wrap.appendChild(det);
    rrow.appendChild(wrap);
    thread.appendChild(rrow);
  }
  scrollDown();
}

function appendToolCalls(trace) {
  if (!optTools.checked || !trace || !trace.length) return;
  const wrap = el("div", "toolcalls");
  for (const t of trace) {
    const det = el("details", "toolcall" + (t.blocked ? " blocked" : ""));
    const sum = el("summary");
    sum.appendChild(el("span", "tname", t.tool));
    const targs = el("span", "targs", argsSummary(t.args));
    sum.appendChild(targs);
    sum.appendChild(el("span", "ttime", (t.elapsed_ms || 0) + "ms"));
    det.appendChild(sum);
    det.appendChild(el("div", "tbody", (t.result || "(no output)").trim()));
    wrap.appendChild(det);
  }
  thread.appendChild(wrap);
  scrollDown();
}

function appendThinking() {
  const row = el("div", "row assistant");
  const t = el("div", "thinking", "thinking");
  const dots = el("span", "dot", " . . .");
  t.appendChild(dots);
  row.appendChild(t);
  thread.appendChild(row);
  scrollDown();
  return row;
}

// ── send / stop ──────────────────────────────────────────────────
function setBusyUI(b) {
  sendBtn.textContent = b ? "Stop" : "Send";
  sendBtn.classList.toggle("stop", b);
}

async function stopTurn() {
  // Abort the client request AND tell the server to halt the in-flight turn.
  if (controller) controller.abort();
  try { await fetch("/cancel", { method: "POST" }); } catch (e) {}
}

// ── harness run activity (streamed into the chat) ───────────────
async function startRun(goal) {
  if (!goal) { appendMessage("assistant", "usage: /run <goal>"); return; }
  let run;
  try {
    const resp = await fetch("/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ goal, created_by: "user" })
    });
    const data = await resp.json();
    run = data.run;
  } catch (e) {
    appendMessage("assistant", "(error starting run: " + e.message + ")");
    return;
  }
  if (!run || !run.run_id) { appendMessage("assistant", "(failed to start run)"); return; }
  appendMessage("assistant", "started run `" + run.run_id.slice(-8) + "` — live below.");
  const card = createRunCard(run.run_id);
  thread.appendChild(card);
  scrollDown();
  streamRun(run.run_id, card);
}

function createRunCard(runId) {
  const card = el("div", "runcard");
  const head = el("div", "rc-head");
  head.appendChild(el("span", "rc-id", "run " + runId.slice(-8)));
  const status = el("span", "rc-status", "starting…");
  head.appendChild(status);
  card.appendChild(head);
  card.appendChild(el("div", "rc-body"));
  return card;
}

function summarizeArgs(args) {
  if (!args) return "";
  let s;
  try { s = typeof args === "string" ? args : JSON.stringify(args); } catch (_) { return ""; }
  return s.length > 90 ? s.slice(0, 90) + "…" : s;
}

function renderRunEvent(o, body, statusEl, st) {
  const t = o.type;
  if (t === "run_started") { statusEl.textContent = "running"; statusEl.className = "rc-status"; return; }
  if (t === "run_finished") {
    const s = (o.data && o.data.status) || "done";
    statusEl.textContent = s;
    statusEl.className = "rc-status rc-" + s;
    return;
  }
  // live model tokens (reasoning -> thinking, content -> narration)
  if (t === "token") {
    const d = o.data || {};
    if (d.kind === "reasoning") {
      if (!st.thinking) {
        st.thinking = el("details", "rc-thinking");
        st.thinking.appendChild(el("summary", null, "thinking"));
        st.thinkingBody = el("div", "rc-thinking-body");
        st.thinking.appendChild(st.thinkingBody);
        body.appendChild(st.thinking);
      }
      st.thinkingBody.textContent += d.text || "";
    } else if (d.kind === "content") {
      if (!st.narration) {
        st.narration = el("div", "rc-narration");
        body.appendChild(st.narration);
      }
      st.narration.textContent += d.text || "";
    }
    scrollDown();
    return;
  }
  if (t === "plan_created") {
    st.thinking = null; st.thinkingBody = null; st.narration = null;  // close planner's live tokens
    const tasks = (o.data && o.data.tasks) || [];
    const line = el("div", "rc-line", "📋 plan — " + tasks.length + " task" + (tasks.length === 1 ? "" : "s"));
    body.appendChild(line);
    for (const task of tasks) {
      const ti = el("div", "rc-line rc-task-item", "  · " + task);
      body.appendChild(ti);
    }
    return;
  }
  if (t === "task_started") {
    st.thinking = null; st.thinkingBody = null; st.narration = null;  // new step, fresh live tokens
    const title = (o.data && o.data.title) || "task";
    body.appendChild(el("div", "rc-line rc-task", "🔧 " + title));
    return;
  }
  if (t === "task_completed") { body.appendChild(el("div", "rc-line rc-ok", "✅ task done")); return; }
  if (t === "task_failed") {
    const err = (o.data && o.data.error) ? String(o.data.error).slice(0, 140) : "";
    body.appendChild(el("div", "rc-line rc-fail", "❌ task failed" + (err ? ": " + err : "")));
    return;
  }
  if (t === "verification_passed") { body.appendChild(el("div", "rc-line rc-ok", "✔ verified")); return; }
  if (t === "verification_failed") { body.appendChild(el("div", "rc-line rc-fail", "✗ verification failed")); return; }
  if (t === "replan_requested" || t === "replan_started") { body.appendChild(el("div", "rc-line", "🔄 replanning…")); return; }
  if (t === "tool_call") {
    const d = o.data || {};
    const tool = d.tool || "tool";
    const args = summarizeArgs(d.args);
    const line = el("div", "rc-line", "⚙ " + tool + (args ? "  " + args : ""));
    if (d.result) {
      const det = el("details", "rc-toolres");
      const sum = el("summary", null, (d.elapsed_ms ? (d.elapsed_ms + "ms") : "done"));
      det.appendChild(sum);
      det.appendChild(el("div", "rc-res", String(d.result).trim().slice(0, 900)));
      line.appendChild(det);
    }
    body.appendChild(line);
    return;
  }
  // step_*, tool_completed, checkpoint_*, planning_*, run_created, task_created — noise, skip
}

async function streamRun(runId, card) {
  const body = card.querySelector(".rc-body");
  const statusEl = card.querySelector(".rc-status");
  const st = { thinking: null, thinkingBody: null, narration: null };
  try {
    const resp = await fetch("/runs/" + runId + "/stream");
    if (!resp.ok) { statusEl.textContent = "stream error " + resp.status; return; }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of ev.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const p = line.slice(5).trim();
          if (!p || p === "[DONE]") continue;
          let o; try { o = JSON.parse(p); } catch (_) { continue; }
          renderRunEvent(o, body, statusEl, st);
        }
      }
      scrollDown();
    }
  } catch (e) {
    statusEl.textContent = "stream error";
  }
}

async function watchRun(runId) {
  if (!runId) { appendMessage("assistant", "usage: /watch <run_id>"); return; }
  try {
    const resp = await fetch("/runs/" + runId);
    const d = await resp.json();
    if (!d.run) { appendMessage("assistant", "no such run: " + runId); return; }
  } catch (e) { appendMessage("assistant", "(error: " + e.message + ")"); return; }
  appendMessage("assistant", "watching run `" + runId.slice(-8) + "` — live below.");
  const card = createRunCard(runId);
  thread.appendChild(card);
  scrollDown();
  streamRun(runId, card);
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  input.style.height = "auto";
  appendMessage("user", text);
  history.push({ role: "user", content: text });
  saveConversation();

  // /run <goal> → start a harness run and stream its live activity into the chat
  if (/^\/run(\s|$)/.test(text)) {
    const goal = text.replace(/^\/run\b/, "").trim();
    startRun(goal);
    return;
  }

  // /watch <run_id> → stream an existing (e.g. resumed) run into the chat
  if (/^\/watch(\s|$)/.test(text)) {
    const runId = text.replace(/^\/watch\b/, "").trim();
    watchRun(runId);
    return;
  }

  busy = true;
  setBusyUI(true);
  controller = new AbortController();

  // assistant row filled live as tokens stream in
  const row = el("div", "row assistant");
  const bubble = el("div", "bubble");
  bubble.textContent = "…";
  row.appendChild(bubble);
  thread.appendChild(row);
  scrollDown();

  let content = "";
  let reasoning = "";

  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages: history, stream: true }),
      signal: controller.signal
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, i);
        buf = buf.slice(i + 2);
        for (const line of ev.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const p = line.slice(5).trim();
          if (!p || p === "[DONE]") continue;
          let o; try { o = JSON.parse(p); } catch (_) { continue; }
          const d = (o.choices && o.choices[0] && o.choices[0].delta) || {};
          if (d.reasoning) reasoning += d.reasoning;
          if (d.content) {
            content += d.content;
            bubble.textContent = content;   // plain text while streaming (no markdown flicker)
            scrollDown();
          }
        }
      }
    }

    // done — reasoning details + full markdown render
    if (reasoning.trim() && optThinking.checked) {
      const det = el("details", "reasoning");
      det.appendChild(el("summary", null, "thinking"));
      det.appendChild(el("div", "body", reasoning.trim()));
      row.insertBefore(det, bubble);
    }
    if (!content) content = "(no response)";
    bubble.innerHTML = renderMarkdown(content);
    history.push({ role: "assistant", content: content });
    saveConversation();
    scrollDown();
  } catch (e) {
    if (e.name === "AbortError") {
      if (content) {
        bubble.innerHTML = renderMarkdown(content);
        history.push({ role: "assistant", content: content });
        saveConversation();
      } else {
        bubble.textContent = "[stopped]";
      }
    } else {
      bubble.textContent = "(error: " + e.message + ")";
    }
  } finally {
    busy = false;
    controller = null;
    setBusyUI(false);
    input.focus();
  }
}

// ── wiring ───────────────────────────────────────────────────────
sendBtn.addEventListener("click", () => {
  if (busy) stopTurn();
  else send();
});

input.addEventListener("keydown", (e) => {
  if (palette.classList.contains("open")) {
    const n = paletteCount();
    if (e.key === "ArrowDown") { e.preventDefault(); paletteSel = (paletteSel + 1) % n; updatePaletteSelection(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); paletteSel = (paletteSel - 1 + n) % n; updatePaletteSelection(); return; }
    if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); palettePick(); return; }
    if (e.key === "Escape") { palette.classList.remove("open"); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
  updatePalette();
});

document.getElementById("new-chat").addEventListener("click", () => {
  newConversation();
});

// settings popover
document.getElementById("settings-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  settingsPanel.classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!settingsPanel.contains(e.target)) settingsPanel.classList.remove("open");
});

convsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  convsPanel.classList.toggle("open");
  if (convsPanel.classList.contains("open")) refreshConvsList();
});
document.addEventListener("click", (e) => {
  if (!convsPanel.contains(e.target) && e.target !== convsBtn) convsPanel.classList.remove("open");
});

// ── harness interface: commands + live runs + / palette ──────────
const HARNESS_COMMANDS = [
  ["/run <goal>", "start a planned run"],
  ["/watch <run>", "stream a run's live activity into the chat"],
  ["/runs [status]", "list runs"],
  ["/status [run]", "run status (default: last)"],
  ["/plan <run>", "current plan"],
  ["/tasks <run>", "tasks + state"],
  ["/log <run> [n]", "last n events"],
  ["/files <run>", "artifacts"],
  ["/metrics", "harness metrics"],
  ["/pause <run>", "pause a run"],
  ["/resume <run>", "resume a run"],
  ["/cancel <run>", "cancel a run"],
  ["/retry <run>", "retry a run"],
  ["/replan <run> [reason]", "replan remaining work"],
  ["/approve <run> [note]", "approve a waiting task"],
  ["/reject <run> [reason]", "reject a waiting task"],
  ["/skills [query]", "list skills"],
  ["/tools", "list tools"],
  ["/profiles", "list profiles"],
  ["/strategies", "list strategies"],
  ["/memory <query>", "search memory"],
  ["/search <query>", "search memory"],
  ["/evolution [status]", "system evolution"],
  ["/approve-change <id>", "approve a proposal"],
  ["/reject-change <id>", "reject a proposal"],
  ["/jobs", "list jobs"],
  ["/config", "show config"],
  ["/models", "list models"],
  ["/help", "show this help"],
];

const harnessBtn = document.getElementById("harness-btn");
const harnessPanel = document.getElementById("harness-panel");
const harnessRuns = document.getElementById("harness-runs");
const harnessCmds = document.getElementById("harness-cmds");

const palette = document.createElement("div");
palette.className = "palette";
document.body.appendChild(palette);
let paletteSel = 0;

function escAttr(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function resizeInput() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}
function paletteCount() { return palette.querySelectorAll(".cmd-item").length; }

function renderHarnessCmds() {
  harnessCmds.innerHTML = HARNESS_COMMANDS.map(([c, d]) =>
    `<div class="cmd-line" data-cmd="${escAttr(c)}"><span class="cname">${escAttr(c)}</span><span class="cdesc">${escAttr(d)}</span></div>`).join("");
  harnessCmds.querySelectorAll(".cmd-line").forEach(line => {
    line.onclick = () => { commandInsert(line.dataset.cmd); harnessPanel.classList.remove("open"); };
  });
}

// ── command sidebar (collapsible) ────────────────────────────────
const sidebar = document.getElementById("sidebar");
const sidebarCmds = document.getElementById("sidebar-cmds");
const sbToggle = document.getElementById("sb-toggle");
const runIdField = document.getElementById("runid-field");
// Persist the run-id field so it survives navigation/refresh (same pattern as
// the sidebar-collapse flag below).
try { runIdField.value = localStorage.getItem("mneme.runId") || ""; } catch (e) {}
runIdField.addEventListener("input", () => {
  try { localStorage.setItem("mneme.runId", runIdField.value); } catch (e) {}
});

// Insert a command into the composer, substituting the sidebar Run ID field
// into any command that takes a <run> (or optional [run]) argument. Commands
// that don't reference a run are left as just the command name.
function commandInsert(cmd) {
  const rid = runIdField.value.trim();
  if (rid && /<run>|\[run\]/.test(cmd)) {
    input.value = cmd.replace(/<run>|\[run\]/g, rid) + " ";
  } else {
    input.value = cmd.split(" ")[0] + " ";
  }
  resizeInput();
  palette.classList.remove("open");
  input.focus();
}

function renderSidebar() {
  sidebarCmds.innerHTML = HARNESS_COMMANDS.map(([c, d]) => {
    const name = c.split(" ")[0];
    return `<button class="sb-cmd" data-cmd="${escAttr(c)}" title="${escAttr(c)}"><span class="sb-name">${escAttr(name)}</span><span class="sb-desc">${escAttr(d)}</span></button>`;
  }).join("");
  sidebarCmds.querySelectorAll(".sb-cmd").forEach(b => {
    b.onclick = () => commandInsert(b.dataset.cmd);
  });
}

sbToggle.addEventListener("click", () => {
  sidebar.classList.toggle("collapsed");
  sbToggle.textContent = sidebar.classList.contains("collapsed") ? "»" : "«";
  try { localStorage.setItem("mneme.sidebarCollapsed", sidebar.classList.contains("collapsed") ? "1" : "0"); } catch (e) {}
});
try {
  if (localStorage.getItem("mneme.sidebarCollapsed") === "1") {
    sidebar.classList.add("collapsed");
    sbToggle.textContent = "»";
  }
} catch (e) {}
renderSidebar();

// ── file browser ────────────────────────────────────────────────
const fileBrowser = document.getElementById("file-browser");
const fbPath = document.getElementById("fb-path");
const fbUp = document.getElementById("fb-up");
const fbRefresh = document.getElementById("fb-refresh");
let fbCurrent = "";

function insertPath(p) {
  input.value = (input.value.trim() ? input.value.trim() + " " : "") + p;
  resizeInput(); input.focus();
}

function fsList(path) {
  fetch("/fs/list?path=" + encodeURIComponent(path || "")).then(r => r.json()).then(d => {
    fbCurrent = d.current || "";
    fbPath.textContent = (d.current === "." || !d.current) ? "~" : d.current;
    if (!d.items || !d.items.length) { fileBrowser.innerHTML = '<div class="fb-empty">(empty)</div>'; return; }
    fileBrowser.innerHTML = d.items.map(it => {
      const ico = it.type === "dir" ? "📁" : "📄";
      const badge = it.in_model_scope ? '<span class="fb-badge">rw</span>' : '<span class="fb-badge">ro</span>';
      return `<div class="fb-item${it.in_model_scope ? "" : " out"}" draggable="${it.type === "file"}" data-path="${escAttr(it.path)}" data-abspath="${escAttr(it.abspath)}" data-type="${it.type}"><span class="fb-ico">${ico}</span><span class="fb-name">${escAttr(it.name)}</span>${badge}</div>`;
    }).join("");
    fileBrowser.querySelectorAll(".fb-item").forEach(el => {
      el.onclick = () => {
        if (el.dataset.type === "dir") fsList(el.dataset.path);
        else insertPath(el.dataset.abspath);
      };
      if (el.dataset.type === "file") {
        el.ondragstart = (e) => { e.dataTransfer.setData("text/plain", el.dataset.abspath); e.dataTransfer.effectAllowed = "copy"; };
      }
    });
  }).catch(() => { fileBrowser.innerHTML = '<div class="fb-empty">error loading</div>'; });
}

fbUp.onclick = () => fsList(fbCurrent.split("/").slice(0, -1).join("/"));
fbRefresh.onclick = () => fsList(fbCurrent);
fsList("");

// drop a dragged file path into the composer
input.addEventListener("dragover", (e) => e.preventDefault());
input.addEventListener("drop", (e) => {
  e.preventDefault();
  const p = e.dataTransfer.getData("text/plain");
  if (p) insertPath(p);
});

async function loadHarnessRuns() {
  try {
    const r = await fetch("/runs?limit=8");
    if (!r.ok) return;
    const { runs } = await r.json();
    harnessRuns.innerHTML = (runs || []).map(r => `
      <a class="run-item" href="/runs/ui">
        <span class="badge s-${escAttr(r.status)}">${escAttr(r.status)}</span>
        <span class="rgoal">${escAttr(r.goal || "")}</span>
        <span class="rtime">${escAttr((r.created_at || "").slice(5, 16))}</span>
      </a>`).join("") || '<div style="color:var(--muted);padding:4px 8px">No runs yet.</div>';
  } catch (e) {}
}

harnessBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  harnessPanel.classList.toggle("open");
  if (harnessPanel.classList.contains("open")) loadHarnessRuns();
});
document.addEventListener("click", (e) => {
  if (!harnessPanel.contains(e.target) && e.target !== harnessBtn) harnessPanel.classList.remove("open");
});
// Dismiss the "/" command palette on outside click — it otherwise sticks when the
// user clicks away (e.g. into the command sidebar) while it's open.
document.addEventListener("click", (e) => {
  if (!palette.contains(e.target) && e.target !== input) {
    palette.classList.remove("open");
  }
});

document.getElementById("hrun-start").addEventListener("click", async () => {
  const goal = document.getElementById("hrun-goal").value.trim();
  if (!goal) return;
  document.getElementById("hrun-goal").value = "";
  harnessPanel.classList.remove("open");   // close the dropdown
  startRun(goal);                          // stream the run's live activity into the chat
});
document.getElementById("hrun-goal").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); document.getElementById("hrun-start").click(); }
});

function updatePalette() {
  const v = input.value;
  // The palette completes a bare command name. Once a space appears the user is
  // typing arguments, so close it — Enter must SEND the request, not re-pick the
  // command (otherwise a typed "/run <goal>" would vanish on Enter because the
  // palette was still open — e.g. "/runs" is a prefix match of "/run").
  if (!v.startsWith("/") || v.includes(" ")) { palette.classList.remove("open"); return; }
  const prefix = v;
  const matches = HARNESS_COMMANDS.filter(([c]) => c.split(" ")[0].startsWith(prefix));
  if (!matches.length) { palette.classList.remove("open"); return; }
  paletteSel = Math.min(paletteSel, matches.length - 1);
  palette.innerHTML = matches.map(([c, d], i) =>
    `<div class="cmd-item${i === paletteSel ? " sel" : ""}" data-cmd="${escAttr(c)}"><span class="cname">${escAttr(c)}</span><span class="cdesc">${escAttr(d)}</span></div>`).join("");
  const rect = input.getBoundingClientRect();
  palette.classList.add("open");
  palette.style.left = rect.left + "px";
  palette.style.top = (rect.top - palette.offsetHeight - 8) + "px";
  palette.querySelectorAll(".cmd-item").forEach((it, i) => {
    it.onclick = () => { commandInsert(it.dataset.cmd); palette.classList.remove("open"); };
    it.onmouseenter = () => { paletteSel = i; updatePaletteSelection(); };
  });
}
function updatePaletteSelection() {
  palette.querySelectorAll(".cmd-item").forEach((it, i) => it.classList.toggle("sel", i === paletteSel));
}
function palettePick() {
  const items = palette.querySelectorAll(".cmd-item");
  if (!items.length) return;
  const sel = items[paletteSel] || items[0];
  commandInsert(sel.dataset.cmd);
  palette.classList.remove("open");
}

renderHarnessCmds();
loadHarnessRuns();
setInterval(loadHarnessRuns, 8000);

// ── conversation persistence ─────────────────────────────────────
async function saveConversation() {
  if (!convId) return;
  try {
    await fetch("/conversations/" + convId, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
  } catch (e) {}
}

async function newConversation() {
  try {
    const r = await fetch("/conversations", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const d = await r.json();
    if (d.conversation) convId = d.conversation.id;
  } catch (e) { convId = null; }
  history = [];
  thread.innerHTML = "";
  input.focus();
  refreshConvsList();
}

function renderMessage(m) {
  if (m.role === "user") appendMessage("user", m.content || "");
  else appendMessage("assistant", m.content || "", m.reasoning || "");
}

async function loadConversation(id) {
  try {
    const r = await fetch("/conversations/" + id);
    const d = await r.json();
    if (!d.conversation) return;
    convId = d.conversation.id;
    history = d.conversation.messages || [];
    thread.innerHTML = "";
    for (const m of history) renderMessage(m);
    scrollDown();
  } catch (e) {}
}

async function deleteConversation(id) {
  if (!confirm("Delete this conversation?")) return;
  try { await fetch("/conversations/" + id, { method: "DELETE" }); } catch (e) {}
  if (id === convId) await newConversation();
  else refreshConvsList();
}

async function refreshConvsList() {
  const list = document.getElementById("convs-list");
  if (!list) return;
  try {
    const r = await fetch("/conversations");
    const d = await r.json();
    const convs = d.conversations || [];
    if (!convs.length) { list.innerHTML = '<div class="conv-empty">no conversations yet</div>'; return; }
    list.innerHTML = convs.map(c =>
      `<div class="conv-item${c.id === convId ? " active" : ""}" data-id="${escAttr(c.id)}">
         <div class="conv-main"><span class="conv-title">${escAttr(c.title)}</span><span class="conv-time">${escAttr((c.updated_at || "").slice(0, 16).replace("T", " "))}</span></div>
         <button class="conv-del" title="Delete conversation">✕</button>
       </div>`).join("");
    list.querySelectorAll(".conv-item").forEach(it => {
      it.onclick = () => { loadConversation(it.dataset.id); convsPanel.classList.remove("open"); };
      it.querySelector(".conv-del").onclick = (e) => { e.stopPropagation(); deleteConversation(it.dataset.id); };
    });
  } catch (e) {}
}

async function initConversation() {
  try {
    const r = await fetch("/conversations");
    const d = await r.json();
    const convs = d.conversations || [];
    if (convs.length) await loadConversation(convs[0].id);   // most recent
    else await newConversation();
  } catch (e) { convId = null; }
  refreshConvsList();
}

// ── model picker (provider -> model switcher) ───────────────────
let currentModelId = "";
let currentBackend = "";
const modelPicker = document.createElement("div");
modelPicker.id = "model-picker";
modelPicker.className = "palette";
modelPicker.innerHTML =
  '<div class="mp-view" data-view="providers">' +
    '<div class="mp-head">Providers</div>' +
    '<div class="mp-provider-list"></div>' +
  '</div>' +
  '<div class="mp-view" data-view="models" style="display:none">' +
    '<div class="mp-head"><a class="mp-back">← providers</a> <span class="mp-prov-title"></span><button class="mp-key-btn" style="display:none">Set key</button></div>' +
    '<input class="mp-search" placeholder="Search models…" />' +
    '<div class="mp-custom"><input class="mp-custom-input" placeholder="enter a model id…" /><button class="mp-custom-btn">Use</button></div>' +
    '<div class="mp-cur"></div><div class="mp-list"></div>' +
  '</div>';
document.body.appendChild(modelPicker);
const mpSearch = modelPicker.querySelector(".mp-search");
const mpList = modelPicker.querySelector(".mp-list");
const mpCur = modelPicker.querySelector(".mp-cur");
const mpProviderList = modelPicker.querySelector(".mp-provider-list");
const mpProvTitle = modelPicker.querySelector(".mp-prov-title");
const mpCustomInput = modelPicker.querySelector(".mp-custom-input");
const mpCustomBtn = modelPicker.querySelector(".mp-custom-btn");
const mpKeyBtn = modelPicker.querySelector(".mp-key-btn");
let mpCatalog = [];
let mpModels = [];
let mpCurrentProvider = "";     // provider the user is browsing
let mpActiveProvider = "";      // currently active provider (from /providers)

const keyDialog = document.createElement("div");
keyDialog.id = "key-dialog";
keyDialog.innerHTML =
  '<div class="kd-box"><div class="kd-title"></div>' +
  '<input class="kd-input" type="password" placeholder="API key" />' +
  '<div class="kd-actions"><button class="kd-cancel">Cancel</button><button class="kd-save">Save</button></div></div>';
document.body.appendChild(keyDialog);
let keyProvider = "";

function showView(v) {
  modelPicker.querySelectorAll(".mp-view").forEach(el => {
    el.style.display = (el.dataset.view === v) ? "" : "none";
  });
}

function renderProviders() {
  if (!mpCatalog.length) { mpProviderList.innerHTML = '<div class="mp-empty">No providers configured.</div>'; return; }
  mpProviderList.innerHTML = mpCatalog.map(p => {
    const isCur = p.name === mpActiveProvider;
    const keyBadge = p.kind === "ollama"
      ? '<span class="mp-prov-kind">local</span>'
      : `<span class="mp-prov-key mp-setkey-link" data-setkey="${escAttr(p.name)}" title="${p.has_key ? 'Update key' : 'Set key'}">${p.has_key ? '✓' : 'set key'}</span>`;
    return `<div class="mp-prov${isCur ? " cur" : ""}" data-prov="${escAttr(p.name)}">` +
      `<span class="mp-prov-name">${escAttr(p.label || p.name)}</span>${keyBadge}</div>`;
  }).join("");
  mpProviderList.querySelectorAll(".mp-prov").forEach(div => {
    div.onclick = () => selectProvider(div.dataset.prov);
  });
  // The key badge opens the add/update dialog directly (without entering the models view).
  mpProviderList.querySelectorAll(".mp-setkey-link").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      mpCurrentProvider = el.dataset.setkey;
      openKeyDialog(el.dataset.setkey);
    };
  });
}

function updateKeyBtn(p) {
  // Hide the key button for local (ollama) providers; otherwise offer
  // "Add key" (no key yet) or "Update key" (change the stored key).
  if ((p || {}).kind === "ollama") { mpKeyBtn.style.display = "none"; return; }
  mpKeyBtn.style.display = "";
  mpKeyBtn.textContent = (p || {}).has_key ? "Update key" : "Add key";
}

async function selectProvider(name) {
  mpCurrentProvider = name;
  const p = mpCatalog.find(x => x.name === name) || { label: name, kind: "openai" };
  mpProvTitle.textContent = p.label || name;
  updateKeyBtn(p);
  showView("models");
  mpSearch.value = ""; mpCustomInput.value = ""; mpModels = []; renderModels("");
  mpSearch.focus();
  try {
    const d = await (await fetch(`/providers/${encodeURIComponent(name)}/models`)).json();
    if (d.needs_key) {
      mpCur.textContent = "This provider needs an API key.";
      openKeyDialog(name);
      return;
    }
    mpModels = d.models || [];
    renderModels("");
  } catch (e) { renderModels(""); }
}

function renderModels(filter) {
  const f = (filter || "").toLowerCase();
  let items = mpModels;
  if (f) items = items.filter(m => ((m.id || "") + " " + (m.name || "")).toLowerCase().includes(f));
  mpCur.textContent = "current: " + (currentModelId || "…");
  if (!items.length) {
    mpList.innerHTML = '<div class="mp-empty">No matches — use the "enter a model id" box above.</div>';
    return;
  }
  mpList.innerHTML = items.map(m =>
    `<div class="mp-item" data-id="${escAttr(m.id)}"><span class="mp-id">${escAttr(m.id)}</span></div>`).join("");
  mpList.querySelectorAll(".mp-item").forEach(it => { it.onclick = () => activateModel(it.dataset.id); });
}

async function openModelPicker() {
  const rect = modelLabel.getBoundingClientRect();
  modelPicker.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 460)) + "px";
  modelPicker.style.top = (rect.bottom + 6) + "px";
  modelPicker.classList.add("open");
  showView("providers");
  mpCatalog = []; renderProviders();
  try {
    const d = await (await fetch("/providers")).json();
    mpCatalog = d.catalog || [];
    mpActiveProvider = d.current_provider || "";
    currentModelId = d.current_model || currentModelId;
    currentBackend = d.backend || "";
    renderProviders();
  } catch (e) { renderProviders(); }
}

async function activateModel(id) {
  if (!id || !mpCurrentProvider) return;
  try {
    const d = await (await fetch("/providers/activate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ provider: mpCurrentProvider, model: id }),
    })).json();
    if (d.ok) {
      currentModelId = id;
      mpActiveProvider = mpCurrentProvider;
      modelLabel.textContent = id;
    }
  } catch (e) {}
  modelPicker.classList.remove("open");
}

async function useCustomModel() {
  const v = mpCustomInput.value.trim();
  if (!v) return;
  const isOllama = (mpCatalog.find(x => x.name === mpCurrentProvider) || {}).kind === "ollama";
  const pulled = mpModels.some(m => m.id === v);
  if (isOllama && !pulled) {
    if (confirm(`"${v}" isn't pulled locally. Pull it from Ollama now? (may download several GB)`)) {
      await pullAndUse(v);
    }
    return;
  }
  await activateModel(v);
}

async function pullAndUse(model) {
  mpCur.textContent = "pulling " + model + "…";
  try {
    await fetch("/ollama/pull", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: model }) });
  } catch (e) {}
  for (let i = 0; i < 150; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try {
      const d = await (await fetch(`/providers/${encodeURIComponent(mpCurrentProvider)}/models`)).json();
      mpModels = d.models || [];
      if (mpModels.some(m => m.id === model)) { await activateModel(model); return; }
    } catch (e) {}
    mpCur.textContent = "pulling " + model + "… (" + (i + 1) + ")";
  }
  mpCur.textContent = "pull timed out for " + model;
}

function openKeyDialog(provider) {
  keyProvider = provider;
  keyDialog.querySelector(".kd-title").textContent = "API key for " + provider;
  keyDialog.querySelector(".kd-input").value = "";
  keyDialog.classList.add("open");
  keyDialog.querySelector(".kd-input").focus();
}

async function saveKey() {
  const key = keyDialog.querySelector(".kd-input").value.trim();
  if (!key) return;
  try {
    await fetch("/providers/key", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ provider: keyProvider, key }) });
    // refresh catalog key status + re-fetch the provider's models
    const pc = await (await fetch("/providers")).json();
    mpCatalog = pc.catalog || [];
    renderProviders();
    updateKeyBtn(mpCatalog.find(x => x.name === mpCurrentProvider));
    if (mpCurrentProvider === keyProvider) {
      const d = await (await fetch(`/providers/${encodeURIComponent(keyProvider)}/models`)).json();
      mpModels = d.models || [];
      renderModels("");
    }
  } catch (e) {}
  keyDialog.classList.remove("open");
}

const modelBtn = document.getElementById("model-btn");
modelLabel.style.cursor = "pointer";
modelLabel.title = "Switch model";
modelLabel.onclick = openModelPicker;
if (modelBtn) modelBtn.onclick = openModelPicker;
modelPicker.querySelector(".mp-back").addEventListener("click", () => showView("providers"));
mpSearch.addEventListener("input", () => renderModels(mpSearch.value));
mpSearch.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const first = mpList.querySelector(".mp-item");
    if (first) activateModel(first.dataset.id);
    else if (mpSearch.value.trim()) activateModel(mpSearch.value.trim());
    e.preventDefault();
  } else if (e.key === "Escape") {
    if (modelPicker.querySelector('.mp-view[data-view="models"]').style.display !== "none") showView("providers");
    else modelPicker.classList.remove("open");
  }
});
mpCustomBtn.addEventListener("click", useCustomModel);
mpCustomInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { useCustomModel(); e.preventDefault(); } });
mpKeyBtn.addEventListener("click", () => openKeyDialog(mpCurrentProvider));
keyDialog.querySelector(".kd-save").addEventListener("click", saveKey);
keyDialog.querySelector(".kd-cancel").addEventListener("click", () => keyDialog.classList.remove("open"));
keyDialog.querySelector(".kd-input").addEventListener("keydown", (e) => { if (e.key === "Enter") saveKey(); else if (e.key === "Escape") keyDialog.classList.remove("open"); });
document.addEventListener("click", (e) => {
  if (!modelPicker.contains(e.target) && e.target !== modelLabel && e.target !== modelBtn) {
    modelPicker.classList.remove("open");
  }
  if (keyDialog.classList.contains("open") && e.target === keyDialog) {
    keyDialog.classList.remove("open");
  }
});

// ── boot ─────────────────────────────────────────────────────────
async function boot() {
  try {
    const r = await fetch("/health");
    const h = await r.json();
    currentModelId = h.backend || h.model || "";
    modelLabel.textContent = currentModelId || MODEL;
  } catch (e) {
    modelLabel.textContent = MODEL;
  }
  await initConversation();
  input.focus();
}
boot();
</script>
