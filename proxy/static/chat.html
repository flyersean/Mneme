<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mneme — Chat</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --assistant-bubble: #ffffff;
    --code-bg: #f3f4f6;
    --tool-bg: #f8fafc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .title { font-weight: 600; font-size: 16px; }
  header .model { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  header button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  header button:hover { background: var(--accent-soft); border-color: var(--accent); }
  header #settings-btn { font-size: 16px; padding: 6px 10px; }

  /* settings popover */
  #settings {
    position: absolute;
    top: 52px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
    padding: 12px 14px;
    font-size: 14px;
    display: none;
    z-index: 10;
    min-width: 200px;
  }
  #settings.open { display: block; }
  #settings label { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
  #settings input[type=checkbox] { accent-color: var(--accent); }
  #settings .heading { font-weight: 600; margin-bottom: 4px; color: var(--text); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .inner { max-width: 760px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 14px; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .row.assistant .bubble { background: var(--assistant-bubble); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  .bubble code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .row.user .bubble code { background: rgba(255,255,255,0.22); }
  .bubble pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    margin: 8px 0;
  }
  .row.user .bubble pre { background: rgba(255,255,255,0.18); }

  .thinking { color: var(--muted); font-style: italic; font-size: 14px; padding: 8px 4px; }
  .thinking .dot { animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

  details.reasoning { margin: 4px 0; }
  details.reasoning summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.reasoning .body { color: var(--muted); font-size: 13px; white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 10px; margin-top: 6px; }

  /* tool-call trace */
  .toolcalls {
    display: flex; flex-direction: column; gap: 6px;
    max-width: 760px; margin: 0 auto; width: 100%;
  }
  .toolcall {
    background: var(--tool-bg);
    border: 1px solid var(--border);
    border-left: 3px solid #9ca3af;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .toolcall.blocked { border-left-color: #dc2626; }
  .toolcall summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
    color: var(--text);
  }
  .toolcall summary::-webkit-details-marker { display: none; }
  .toolcall .tname {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 1px 7px;
    border-radius: 5px;
  }
  .toolcall.blocked .tname { color: #dc2626; background: #fef2f2; }
  .toolcall .targs { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolcall .ttime { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .toolcall .tbody {
    margin-top: 6px;
    padding: 6px 8px;
    background: var(--code-bg);
    border-radius: 6px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }

  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 160px;
    outline: none;
    background: var(--panel);
    color: var(--text);
  }
  textarea:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #send:hover { background: #1d4ed8; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div>
    <div class="title">Mneme</div>
    <div class="model" id="model-label">connecting…</div>
  </div>
  <div class="spacer"></div>
  <button id="settings-btn" title="Display settings">⚙</button>
  <button id="new-chat" title="Start a new conversation">New chat</button>
</header>

<div id="settings">
  <div class="heading">Display</div>
  <label><input type="checkbox" id="opt-thinking" checked> Show thinking (reasoning)</label>
  <label><input type="checkbox" id="opt-tools" checked> Show tool calls</label>
</div>

<div id="chat"><div class="inner" id="thread"></div></div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask something… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send">Send</button>
  </div>
</footer>

<script>
const MODEL = "text-mneme:64k";
const thread = document.getElementById("thread");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const modelLabel = document.getElementById("model-label");
const chat = document.getElementById("chat");
const settingsPanel = document.getElementById("settings");
const optThinking = document.getElementById("opt-thinking");
const optTools = document.getElementById("opt-tools");

let history = [];   // [{role, content}]
let busy = false;

// persisted display settings
function loadSetting(key, def) {
  try { const v = localStorage.getItem(key); return v === null ? def : v === "1"; }
  catch (e) { return def; }
}
function saveSetting(key, val) { try { localStorage.setItem(key, val ? "1" : "0"); } catch (e) {} }
optThinking.checked = loadSetting("mneme.showThinking", true);
optTools.checked = loadSetting("mneme.showTools", true);
optThinking.addEventListener("change", () => saveSetting("mneme.showThinking", optThinking.checked));
optTools.addEventListener("change", () => saveSetting("mneme.showTools", optTools.checked));

// ── helpers ──────────────────────────────────────────────────────
function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Minimal markdown: escape HTML, then ```blocks```, `inline`, **bold**.
function renderMarkdown(src) {
  const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const parts = String(src).split(/```/);
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      const code = parts[i].replace(/^[a-zA-Z0-9_+-]*\n/, "");
      html += "<pre>" + escapeHtml(code) + "</pre>";
    } else {
      html += escapeHtml(parts[i])
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }
  }
  return html;
}

function argsSummary(args) {
  if (!args) return "";
  const parts = [];
  for (const [k, v] of Object.entries(args)) {
    if (v === null || v === undefined || v === "") continue;
    const s = String(v);
    parts.push(k + "=" + (s.length > 60 ? s.slice(0, 60) + "…" : s));
  }
  return parts.join("  ");
}

function appendMessage(role, content, reasoning) {
  const row = el("div", "row " + role);
  const bubble = el("div", "bubble");
  bubble.innerHTML = renderMarkdown(content);
  row.appendChild(bubble);
  thread.appendChild(row);

  if (reasoning && reasoning.trim() && optThinking.checked) {
    const det = el("details", "reasoning");
    const sum = el("summary", null, "thinking");
    const body = el("div", "body", reasoning.trim());
    det.appendChild(sum); det.appendChild(body);
    const rrow = el("div", "row assistant");
    const wrap = el("div", "bubble");
    wrap.appendChild(det);
    rrow.appendChild(wrap);
    thread.appendChild(rrow);
  }
  scrollDown();
}

function appendToolCalls(trace) {
  if (!optTools.checked || !trace || !trace.length) return;
  const wrap = el("div", "toolcalls");
  for (const t of trace) {
    const det = el("details", "toolcall" + (t.blocked ? " blocked" : ""));
    const sum = el("summary");
    sum.appendChild(el("span", "tname", t.tool));
    const targs = el("span", "targs", argsSummary(t.args));
    sum.appendChild(targs);
    sum.appendChild(el("span", "ttime", (t.elapsed_ms || 0) + "ms"));
    det.appendChild(sum);
    det.appendChild(el("div", "tbody", (t.result || "(no output)").trim()));
    wrap.appendChild(det);
  }
  thread.appendChild(wrap);
  scrollDown();
}

function appendThinking() {
  const row = el("div", "row assistant");
  const t = el("div", "thinking", "thinking");
  const dots = el("span", "dot", " . . .");
  t.appendChild(dots);
  row.appendChild(t);
  thread.appendChild(row);
  scrollDown();
  return row;
}

// ── send ─────────────────────────────────────────────────────────
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  input.style.height = "auto";
  appendMessage("user", text);
  history.push({ role: "user", content: text });

  busy = true;
  sendBtn.disabled = true;
  const thinkingRow = appendThinking();

  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages: history, stream: false })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    thinkingRow.remove();

    const msg = data.choices && data.choices[0] && data.choices[0].message;
    let content = (msg && msg.content) || "";
    const reasoning = (msg && msg.reasoning) || "";
    if (!content && msg && msg.tool_calls) {
      content = "_(tool call: " + msg.tool_calls.map(t => t.function.name).join(", ") + ")_";
    }
    if (!content) content = "(no response)";

    appendToolCalls(data.tool_trace);
    appendMessage("assistant", content, reasoning);
    history.push({ role: "assistant", content: content });
  } catch (e) {
    thinkingRow.remove();
    appendMessage("assistant", "(error: " + e.message + ")");
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// ── wiring ───────────────────────────────────────────────────────
sendBtn.addEventListener("click", send);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});

document.getElementById("new-chat").addEventListener("click", () => {
  history = [];
  thread.innerHTML = "";
  appendMessage("assistant", "Hi — I'm Mneme, a memory-augmented assistant. I can search my memory, build small tools to work around limits, and grade my own answers for honesty. What should we work on?");
  input.focus();
});

// settings popover
document.getElementById("settings-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  settingsPanel.classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!settingsPanel.contains(e.target)) settingsPanel.classList.remove("open");
});

// ── boot ─────────────────────────────────────────────────────────
async function boot() {
  try {
    const r = await fetch("/health");
    const h = await r.json();
    modelLabel.textContent = (h.model || MODEL) + "  ·  backend " + (h.backend || "?");
  } catch (e) {
    modelLabel.textContent = MODEL;
  }
  appendMessage("assistant", "Hi — I'm Mneme, a memory-augmented assistant. I can search my memory, build small tools to work around limits, and grade my own answers for honesty. What should we work on?");
  input.focus();
}
boot();
</script>
</body>
</html>
