<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mneme — Chat</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --assistant-bubble: #ffffff;
    --code-bg: #f3f4f6;
    --tool-bg: #f8fafc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .title { font-weight: 600; font-size: 16px; }
  header .model { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  header button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  header button:hover { background: var(--accent-soft); border-color: var(--accent); }
  header #settings-btn { font-size: 16px; padding: 6px 10px; }

  /* settings popover */
  #settings {
    position: absolute;
    top: 52px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
    padding: 12px 14px;
    font-size: 14px;
    display: none;
    z-index: 10;
    min-width: 200px;
  }
  #settings.open { display: block; }
  #settings label { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
  #settings input[type=checkbox] { accent-color: var(--accent); }
  #settings .heading { font-weight: 600; margin-bottom: 4px; color: var(--text); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .inner { max-width: 760px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 14px; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .row.assistant .bubble { background: var(--assistant-bubble); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  .bubble code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .row.user .bubble code { background: rgba(255,255,255,0.22); }
  .bubble pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    margin: 8px 0;
  }
  .row.user .bubble pre { background: rgba(255,255,255,0.18); }

  .thinking { color: var(--muted); font-style: italic; font-size: 14px; padding: 8px 4px; }
  .thinking .dot { animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

  details.reasoning { margin: 4px 0; }
  details.reasoning summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.reasoning .body { color: var(--muted); font-size: 13px; white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 10px; margin-top: 6px; }

  /* tool-call trace */
  .toolcalls {
    display: flex; flex-direction: column; gap: 6px;
    max-width: 760px; margin: 0 auto; width: 100%;
  }
  .toolcall {
    background: var(--tool-bg);
    border: 1px solid var(--border);
    border-left: 3px solid #9ca3af;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .toolcall.blocked { border-left-color: #dc2626; }
  .toolcall summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
    color: var(--text);
  }
  .toolcall summary::-webkit-details-marker { display: none; }
  .toolcall .tname {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 1px 7px;
    border-radius: 5px;
  }
  .toolcall.blocked .tname { color: #dc2626; background: #fef2f2; }
  .toolcall .targs { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolcall .ttime { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .toolcall .tbody {
    margin-top: 6px;
    padding: 6px 8px;
    background: var(--code-bg);
    border-radius: 6px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }

  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 160px;
    outline: none;
    background: var(--panel);
    color: var(--text);
  }
  textarea:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #send:hover { background: #1d4ed8; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  #send.stop { background: #dc2626; }
  #send.stop:hover { background: #b91c1c; }
</style>
<style>

.mneme-nav a{padding:5px 12px;border-radius:7px;text-decoration:none;color:#4b5563;font-size:13px;background:#f9fafb;border:1px solid #e5e7eb}
.mneme-nav a:hover{border-color:#2563eb;color:#2563eb}

<style>
/* harness panel + / command palette */
#harness-panel {
  position: absolute; top: 52px; right: 20px;
  width: 380px; max-width: calc(100vw - 40px); max-height: 74vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 14px 16px; font-size: 13px;
  display: none; z-index: 20; text-align: left;
}
#harness-panel.open { display: block; }
#harness-panel h3 { margin: 0 0 8px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
#harness-runs { display: flex; flex-direction: column; gap: 2px; }
.run-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; text-decoration: none; color: var(--text); }
.run-item:hover { background: var(--accent-soft); }
.run-item .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.badge.s-completed { background: #dcfce7; color: #15803d; }
.badge.s-failed, .badge.s-cancelled { background: #fee2e2; color: #b91c1c; }
.badge.s-running, .badge.s-planning, .badge.s-verifying { background: #dbeafe; color: #1d4ed8; }
.badge.s-paused, .badge.s-awaiting_approval { background: #fef3c7; color: #b45309; }
.run-item .rgoal { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-item .rtime { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
#harness-cmds { display: flex; flex-direction: column; gap: 1px; }
.cmd-line { display: flex; gap: 8px; align-items: baseline; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.cmd-line:hover { background: var(--accent-soft); }
.cmd-line .cname { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; color: var(--accent); white-space: nowrap; }
.cmd-line .cdesc { color: var(--muted); font-size: 12px; }
.harness-foot { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
.harness-foot a { color: var(--accent); text-decoration: none; font-size: 12px; }
#harness-panel input, #harness-panel button { font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 7px; }
#harness-panel input { flex: 1; outline: none; background: var(--panel); color: var(--text); }
#harness-panel input:focus { border-color: var(--accent); }
#harness-panel button { cursor: pointer; background: var(--panel); color: var(--text); }
#harness-panel button:hover { border-color: var(--accent); background: var(--accent-soft); }

.palette {
  position: fixed; z-index: 30; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.16);
  max-width: 460px; max-height: 320px; overflow-y: auto; padding: 4px; display: none;
}
.palette.open { display: block; }
.cmd-item { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 7px; cursor: pointer; }
.cmd-item:hover, .cmd-item.sel { background: var(--accent-soft); }
.cmd-item .cname { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; color: var(--accent); white-space: nowrap; }
.cmd-item .cdesc { color: var(--muted); font-size: 12px; }
</style>

<body>

<header>
  <div>
    <div class="title">Mneme</div>
    <div class="model" id="model-label">connecting…</div>
  </div>
  <div class="spacer"></div>
  <button id="settings-btn" title="Display settings">⚙</button>
  <button id="new-chat" title="Start a new conversation">New chat</button>
  <button id="harness-btn" title="Harness runs + commands">⚡ Runs</button>
</header>
<nav class="mneme-nav">
  <a href="/">Dashboard</a>
  <a href="/chat" class="active">Chat</a>
  <a href="/memory">Memory</a>
  <a href="/instructions">Instructions</a>
  <a href="/templates">Templates</a>
  <a href="/ollama">Ollama</a>
  <a href="/runs/ui">Runs</a>
</nav>

<div id="settings">
  <div class="heading">Display</div>
  <label><input type="checkbox" id="opt-thinking" checked> Show thinking (reasoning)</label>
  <label><input type="checkbox" id="opt-tools" checked> Show tool calls</label>
</div>

<div id="harness-panel">
  <h3>New run</h3>
  <div class="row" style="display:flex; gap:6px; margin:0 0 10px;">
    <input id="hrun-goal" placeholder="Goal — the model plans the tasks">
    <button id="hrun-start">Start</button>
  </div>
  <h3>Runs</h3>
  <div id="harness-runs"></div>
  <h3 style="margin-top:12px">Commands — type <span style="font-family:monospace">/</span> in the box</h3>
  <div id="harness-cmds"></div>
  <div class="harness-foot"><a href="/runs/ui">Open Runs page →</a></div>
</div>

<div id="chat"><div class="inner" id="thread"></div></div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask something… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send">Send</button>
  </div>
</footer>

<script>
const MODEL = "text-mneme:64k";
const thread = document.getElementById("thread");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const modelLabel = document.getElementById("model-label");
const chat = document.getElementById("chat");
const settingsPanel = document.getElementById("settings");
const optThinking = document.getElementById("opt-thinking");
const optTools = document.getElementById("opt-tools");

let history = [];   // [{role, content}]
let busy = false;
let controller = null;   // AbortController for the in-flight turn

// persisted display settings
function loadSetting(key, def) {
  try { const v = localStorage.getItem(key); return v === null ? def : v === "1"; }
  catch (e) { return def; }
}
function saveSetting(key, val) { try { localStorage.setItem(key, val ? "1" : "0"); } catch (e) {} }
optThinking.checked = loadSetting("mneme.showThinking", true);
optTools.checked = loadSetting("mneme.showTools", true);
optThinking.addEventListener("change", () => saveSetting("mneme.showThinking", optThinking.checked));
optTools.addEventListener("change", () => saveSetting("mneme.showTools", optTools.checked));

// ── helpers ──────────────────────────────────────────────────────
function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Minimal markdown: escape HTML, then ```blocks```, `inline`, **bold**.
function renderMarkdown(src) {
  const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const parts = String(src).split(/```/);
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      const code = parts[i].replace(/^[a-zA-Z0-9_+-]*\n/, "");
      html += "<pre>" + escapeHtml(code) + "</pre>";
    } else {
      html += escapeHtml(parts[i])
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }
  }
  return html;
}

function argsSummary(args) {
  if (!args) return "";
  const parts = [];
  for (const [k, v] of Object.entries(args)) {
    if (v === null || v === undefined || v === "") continue;
    const s = String(v);
    parts.push(k + "=" + (s.length > 60 ? s.slice(0, 60) + "…" : s));
  }
  return parts.join("  ");
}

function appendMessage(role, content, reasoning) {
  const row = el("div", "row " + role);
  const bubble = el("div", "bubble");
  bubble.innerHTML = renderMarkdown(content);
  row.appendChild(bubble);
  thread.appendChild(row);

  if (reasoning && reasoning.trim() && optThinking.checked) {
    const det = el("details", "reasoning");
    const sum = el("summary", null, "thinking");
    const body = el("div", "body", reasoning.trim());
    det.appendChild(sum); det.appendChild(body);
    const rrow = el("div", "row assistant");
    const wrap = el("div", "bubble");
    wrap.appendChild(det);
    rrow.appendChild(wrap);
    thread.appendChild(rrow);
  }
  scrollDown();
}

function appendToolCalls(trace) {
  if (!optTools.checked || !trace || !trace.length) return;
  const wrap = el("div", "toolcalls");
  for (const t of trace) {
    const det = el("details", "toolcall" + (t.blocked ? " blocked" : ""));
    const sum = el("summary");
    sum.appendChild(el("span", "tname", t.tool));
    const targs = el("span", "targs", argsSummary(t.args));
    sum.appendChild(targs);
    sum.appendChild(el("span", "ttime", (t.elapsed_ms || 0) + "ms"));
    det.appendChild(sum);
    det.appendChild(el("div", "tbody", (t.result || "(no output)").trim()));
    wrap.appendChild(det);
  }
  thread.appendChild(wrap);
  scrollDown();
}

function appendThinking() {
  const row = el("div", "row assistant");
  const t = el("div", "thinking", "thinking");
  const dots = el("span", "dot", " . . .");
  t.appendChild(dots);
  row.appendChild(t);
  thread.appendChild(row);
  scrollDown();
  return row;
}

// ── send / stop ──────────────────────────────────────────────────
function setBusyUI(b) {
  sendBtn.textContent = b ? "Stop" : "Send";
  sendBtn.classList.toggle("stop", b);
}

async function stopTurn() {
  // Abort the client request AND tell the server to halt the in-flight turn.
  if (controller) controller.abort();
  try { await fetch("/cancel", { method: "POST" }); } catch (e) {}
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  input.style.height = "auto";
  appendMessage("user", text);
  history.push({ role: "user", content: text });

  busy = true;
  setBusyUI(true);
  controller = new AbortController();

  // assistant row filled live as tokens stream in
  const row = el("div", "row assistant");
  const bubble = el("div", "bubble");
  bubble.textContent = "…";
  row.appendChild(bubble);
  thread.appendChild(row);
  scrollDown();

  let content = "";
  let reasoning = "";

  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages: history, stream: true }),
      signal: controller.signal
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, i);
        buf = buf.slice(i + 2);
        for (const line of ev.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const p = line.slice(5).trim();
          if (!p || p === "[DONE]") continue;
          let o; try { o = JSON.parse(p); } catch (_) { continue; }
          const d = (o.choices && o.choices[0] && o.choices[0].delta) || {};
          if (d.reasoning) reasoning += d.reasoning;
          if (d.content) {
            content += d.content;
            bubble.textContent = content;   // plain text while streaming (no markdown flicker)
            scrollDown();
          }
        }
      }
    }

    // done — reasoning details + full markdown render
    if (reasoning.trim() && optThinking.checked) {
      const det = el("details", "reasoning");
      det.appendChild(el("summary", null, "thinking"));
      det.appendChild(el("div", "body", reasoning.trim()));
      row.insertBefore(det, bubble);
    }
    if (!content) content = "(no response)";
    bubble.innerHTML = renderMarkdown(content);
    history.push({ role: "assistant", content: content });
    scrollDown();
  } catch (e) {
    if (e.name === "AbortError") {
      if (content) {
        bubble.innerHTML = renderMarkdown(content);
        history.push({ role: "assistant", content: content });
      } else {
        bubble.textContent = "[stopped]";
      }
    } else {
      bubble.textContent = "(error: " + e.message + ")";
    }
  } finally {
    busy = false;
    controller = null;
    setBusyUI(false);
    input.focus();
  }
}

// ── wiring ───────────────────────────────────────────────────────
sendBtn.addEventListener("click", () => {
  if (busy) stopTurn();
  else send();
});

input.addEventListener("keydown", (e) => {
  if (palette.classList.contains("open")) {
    const n = paletteCount();
    if (e.key === "ArrowDown") { e.preventDefault(); paletteSel = (paletteSel + 1) % n; updatePaletteSelection(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); paletteSel = (paletteSel - 1 + n) % n; updatePaletteSelection(); return; }
    if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); palettePick(); return; }
    if (e.key === "Escape") { palette.classList.remove("open"); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
  updatePalette();
});

document.getElementById("new-chat").addEventListener("click", () => {
  history = [];
  thread.innerHTML = "";
  input.focus();
});

// settings popover
document.getElementById("settings-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  settingsPanel.classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!settingsPanel.contains(e.target)) settingsPanel.classList.remove("open");
});

// ── harness interface: commands + live runs + / palette ──────────
const HARNESS_COMMANDS = [
  ["/run <goal>", "start a planned run"],
  ["/runs [status]", "list runs"],
  ["/status [run]", "run status (default: last)"],
  ["/plan <run>", "current plan"],
  ["/tasks <run>", "tasks + state"],
  ["/log <run> [n]", "last n events"],
  ["/files <run>", "artifacts"],
  ["/metrics", "harness metrics"],
  ["/pause <run>", "pause a run"],
  ["/resume <run>", "resume a run"],
  ["/cancel <run>", "cancel a run"],
  ["/retry <run>", "retry a run"],
  ["/replan <run> [reason]", "replan remaining work"],
  ["/approve <run> [note]", "approve a waiting task"],
  ["/reject <run> [reason]", "reject a waiting task"],
  ["/skills [query]", "list skills"],
  ["/tools", "list tools"],
  ["/profiles", "list profiles"],
  ["/strategies", "list strategies"],
  ["/memory <query>", "search memory"],
  ["/search <query>", "search memory"],
  ["/evolution [status]", "system evolution"],
  ["/approve-change <id>", "approve a proposal"],
  ["/reject-change <id>", "reject a proposal"],
  ["/jobs", "list jobs"],
  ["/config", "show config"],
  ["/models", "list models"],
  ["/help", "show this help"],
];

const harnessBtn = document.getElementById("harness-btn");
const harnessPanel = document.getElementById("harness-panel");
const harnessRuns = document.getElementById("harness-runs");
const harnessCmds = document.getElementById("harness-cmds");

const palette = document.createElement("div");
palette.className = "palette";
document.body.appendChild(palette);
let paletteSel = 0;

function escAttr(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function resizeInput() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}
function paletteCount() { return palette.querySelectorAll(".cmd-item").length; }

function renderHarnessCmds() {
  harnessCmds.innerHTML = HARNESS_COMMANDS.map(([c, d]) =>
    `<div class="cmd-line" data-cmd="${escAttr(c)}"><span class="cname">${escAttr(c)}</span><span class="cdesc">${escAttr(d)}</span></div>`).join("");
  harnessCmds.querySelectorAll(".cmd-line").forEach(line => {
    line.onclick = () => { input.value = line.dataset.cmd + " "; resizeInput(); harnessPanel.classList.remove("open"); input.focus(); };
  });
}

async function loadHarnessRuns() {
  try {
    const r = await fetch("/runs?limit=8");
    if (!r.ok) return;
    const { runs } = await r.json();
    harnessRuns.innerHTML = (runs || []).map(r => `
      <a class="run-item" href="/runs/ui">
        <span class="badge s-${escAttr(r.status)}">${escAttr(r.status)}</span>
        <span class="rgoal">${escAttr(r.goal || "")}</span>
        <span class="rtime">${escAttr((r.created_at || "").slice(5, 16))}</span>
      </a>`).join("") || '<div style="color:var(--muted);padding:4px 8px">No runs yet.</div>';
  } catch (e) {}
}

harnessBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  harnessPanel.classList.toggle("open");
  if (harnessPanel.classList.contains("open")) loadHarnessRuns();
});
document.addEventListener("click", (e) => {
  if (!harnessPanel.contains(e.target) && e.target !== harnessBtn) harnessPanel.classList.remove("open");
});

document.getElementById("hrun-start").addEventListener("click", async () => {
  const goal = document.getElementById("hrun-goal").value.trim();
  if (!goal) return;
  try {
    const r = await fetch("/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ goal }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.error || "HTTP " + r.status); return; }
    document.getElementById("hrun-goal").value = "";
    window.location.href = "/runs/ui";   // live view of the new run
  } catch (e) { alert("error: " + e.message); }
});
document.getElementById("hrun-goal").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); document.getElementById("hrun-start").click(); }
});

function updatePalette() {
  const v = input.value;
  if (!v.startsWith("/")) { palette.classList.remove("open"); return; }
  const prefix = v.split(/\s+/)[0];
  const matches = HARNESS_COMMANDS.filter(([c]) => c.split(" ")[0].startsWith(prefix));
  if (!matches.length) { palette.classList.remove("open"); return; }
  paletteSel = Math.min(paletteSel, matches.length - 1);
  palette.innerHTML = matches.map(([c, d], i) =>
    `<div class="cmd-item${i === paletteSel ? " sel" : ""}" data-cmd="${escAttr(c)}"><span class="cname">${escAttr(c)}</span><span class="cdesc">${escAttr(d)}</span></div>`).join("");
  const rect = input.getBoundingClientRect();
  palette.classList.add("open");
  palette.style.left = rect.left + "px";
  palette.style.top = (rect.top - palette.offsetHeight - 8) + "px";
  palette.querySelectorAll(".cmd-item").forEach((it, i) => {
    it.onclick = () => { input.value = it.dataset.cmd + " "; resizeInput(); palette.classList.remove("open"); input.focus(); };
    it.onmouseenter = () => { paletteSel = i; updatePaletteSelection(); };
  });
}
function updatePaletteSelection() {
  palette.querySelectorAll(".cmd-item").forEach((it, i) => it.classList.toggle("sel", i === paletteSel));
}
function palettePick() {
  const items = palette.querySelectorAll(".cmd-item");
  if (!items.length) return;
  const sel = items[paletteSel] || items[0];
  input.value = sel.dataset.cmd + " ";
  resizeInput(); palette.classList.remove("open"); input.focus();
}

renderHarnessCmds();
loadHarnessRuns();
setInterval(loadHarnessRuns, 8000);

// ── boot ─────────────────────────────────────────────────────────
async function boot() {
  try {
    const r = await fetch("/health");
    const h = await r.json();
    modelLabel.textContent = (h.model || MODEL) + "  ·  backend " + (h.backend || "?");
  } catch (e) {
    modelLabel.textContent = MODEL;
  }
  input.focus();
}
boot();
</script>
</body>
</html>
