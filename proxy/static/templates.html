<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mneme — Templates</title>
<style>
  :root { --fg:#1a1a1a; --muted:#6b7280; --bg:#ffffff; --panel:#f7f7f8; --line:#e5e7eb; --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; font-weight:650; }
  header a { color:var(--muted); text-decoration:none; font-size:14px; }
  main { padding:20px 24px; max-width:980px; margin:0 auto; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .badge { font-size:11px; padding:2px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .badge.user { background:var(--accent); border-color:var(--accent); color:#fff; }
  .badge.mf { background:#fef3c7; border-color:#f59e0b; color:#92400e; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; font-size:14px; border-bottom:1px solid var(--line); }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); background:var(--panel); }
  tr:last-child td { border-bottom:none; }
  td .desc { color:var(--muted); font-size:12px; }
  .btn { font:inherit; font-size:13px; padding:5px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); cursor:pointer; }
  .btn:hover { border-color:var(--accent); }
  .btn.danger:hover { border-color:var(--danger); color:var(--danger); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .editor { margin-top:20px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; display:none; }
  .editor.open { display:block; }
  .editor label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .editor input[type=text], .editor textarea { width:100%; font:inherit; font-size:14px; padding:8px; border:1px solid var(--line); border-radius:7px; }
  .editor textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; min-height:200px; }
  .editor .row { display:flex; gap:10px; }
  .editor .row > div { flex:1; }
  #msg { font-size:13px; color:var(--muted); }
  #msg.err { color:var(--danger); }
  #msg.ok { color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>Model templates</h1>
  <a href="/">← Dashboard</a>
</header>
<main>
  <div class="toolbar">
    <span id="msg"></span>
    <button class="btn primary" id="newBtn">+ New template</button>
  </div>
  <table>
    <thead><tr><th>Name</th><th>Description</th><th>Tags</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody>
  </table>

  <div class="editor" id="editor">
    <div class="row">
      <div>
        <label>Name</label>
        <input type="text" id="f_name" placeholder="my-model">
      </div>
    </div>
    <div class="row">
      <div><label>Description</label><input type="text" id="f_desc" placeholder="Short summary"></div>
      <div><label>Notes</label><input type="text" id="f_notes" placeholder="Any caveats"></div>
    </div>
    <label>Body (JSON — sampling / timeouts / models / modelfile)</label>
    <textarea id="f_body" spellcheck="false"></textarea>
    <div style="margin-top:12px; display:flex; gap:10px;">
      <button class="btn primary" id="saveBtn">Save</button>
      <button class="btn danger" id="deleteBtn" style="display:none;">Delete</button>
      <button class="btn" id="cancelBtn">Cancel</button>
    </div>
  </div>
</main>
<script>
let templates = [];
let editingName = null; // null = new

function setMsg(t, ok) {
  const m = document.getElementById('msg');
  m.textContent = t; m.className = ok ? 'ok' : 'err';
}

async function load() {
  const r = await fetch('/templates/data');
  const j = await r.json();
  templates = j.templates || [];
  const rows = document.getElementById('rows');
  if (!templates.length) { rows.innerHTML = '<tr><td colspan="4">No templates yet.</td></tr>'; return; }
  rows.innerHTML = templates.map(t => {
    const tags = [];
    tags.push(t.user ? '<span class="badge user">user</span>' : '<span class="badge">shipped</span>');
    if (t.has_modelfile) tags.push('<span class="badge mf">modelfile</span>');
    const actions = [];
    actions.push(`<button class="btn" onclick="edit('${t.name}')">Edit</button>`);
    if (t.user) actions.push(`<button class="btn danger" onclick="del('${t.name}')">Delete</button>`);
    if (t.has_modelfile) actions.push(`<button class="btn" onclick="install('${t.name}')">Install modelfile</button>`);
    return `<tr>
      <td><code>${t.name}</code></td>
      <td>${esc(t.description)}<div class="desc">${esc(t.notes)}</div></td>
      <td>${tags.join(' ')}</td>
      <td>${actions.join(' ')}</td>
    </tr>`;
  }).join('');
}

function esc(s) { return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function openEditor(t) {
  document.getElementById('editor').classList.add('open');
  document.getElementById('f_name').value = t ? t.name : '';
  document.getElementById('f_desc').value = t ? (t.description||'') : '';
  document.getElementById('f_notes').value = t ? (t.notes||'') : '';
  const body = t ? {description:t.description, notes:t.notes, sampling:t.sampling, timeouts:t.timeouts, models:t.models, modelfile:t.modelfile}
                  : {description:'', notes:'', sampling:{}, timeouts:{}, models:{}, modelfile:{}};
  document.getElementById('f_body').value = JSON.stringify(body, null, 2);
  document.getElementById('f_name').disabled = !!(t && !t.user);
  document.getElementById('deleteBtn').style.display = (t && t.user) ? '' : 'none';
  editingName = t ? t.name : null;
}

function edit(name) { const t = templates.find(x => x.name === name); if (t) openEditor(t); }

document.getElementById('newBtn').addEventListener('click', () => { openEditor(null); });
document.getElementById('cancelBtn').addEventListener('click', () => document.getElementById('editor').classList.remove('open'));

document.getElementById('saveBtn').addEventListener('click', async () => {
  const name = document.getElementById('f_name').value.trim();
  if (!/^[a-z0-9][a-z0-9._-]*$/.test(name)) { setMsg('Invalid name (a-z 0-9 . _ -)', false); return; }
  let body;
  try { body = JSON.parse(document.getElementById('f_body').value); }
  catch (e) { setMsg('Body is not valid JSON: ' + e.message, false); return; }
  if (!body || typeof body !== 'object') { setMsg('Body must be a JSON object', false); return; }
  const r = await fetch('/templates/save', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, template: body })
  });
  const j = await r.json();
  if (!r.ok) { setMsg(j.error || 'save failed', false); return; }
  setMsg('Saved ' + j.name, true);
  await load();
});

async function del(name) {
  if (!confirm('Delete user template ' + name + '?')) return;
  const r = await fetch('/templates/delete', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name })
  });
  const j = await r.json();
  if (!r.ok) { setMsg(j.error || 'delete failed', false); return; }
  setMsg('Deleted ' + name, true);
  await load();
}

async function install(name) {
  setMsg('Installing Modelfile for ' + name + '… (this can take a while)', true);
  const r = await fetch('/templates/install-modelfile', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name })
  });
  const j = await r.json();
  setMsg(j.ok ? ('Installed ' + name) : ('Install failed: ' + JSON.stringify(j.steps || j.error)), !j.ok ? false : true);
}

load();
</script>
</body>
</html>
