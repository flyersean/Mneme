# Shipped strategies — loaded into the strategies table on startup (INSERT OR
# IGNORE) so they survive restarts AND a DB reset. Versioned in git; this is the
# curated "problem-solving playbook" set that ships with Mneme.
#
# Each entry:
#   id            unique slug (stable across DBs)
#   problem_type  one of: web_retrieval | compute | live_data | code | error |
#                 memory_operation | other  (see mneme/capability._classify_problem_type)
#   grade         A (known-good curated) / B / C
#   cost          relative cost hint (0 = cheap); cheaper wins a retrieval slot
#   text          the playbook, injected on matching problem-type turns/failures
#
# User promotions go to strategies.user.yaml (per-instance), NOT this file.

- id: web_hidden_api
  problem_type: web_retrieval
  grade: A
  cost: 0
  created_by: shipped
  text: |
    WHEN a page returns empty or JS-only content (blank DOM, client-side rendering), do NOT guess or give up — the data is usually reachable another way. In order:
    (1) retry fetch_url on the SAME url with render_js: true;
    (2) probe for a machine-readable API: /api, /openapi.json, /swagger.json, /llms.txt, robots.txt, sitemap.xml, or the URL with .json/.csv appended;
    (3) check for an alternate serialization via the HTTP Link: rel=alternate header;
    (4) for Hugging Face model facts, use https://huggingface.co/api/models/<org>/<name> (JSON metadata: license, tags, downloads) and the model card's model-index block for benchmark scores.
    Prefer the API over scraping rendered HTML.
