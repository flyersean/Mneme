# ── Mind module: GUARDIAN (hallucination watcher) ──────────────────────────
# Watches the main model's output for a hallucination being treated as a source
# of truth, and injects a warning when it finds one. Fast + cheap detector.

module: guardian

port: 8093                     # fixed port -> chunks/instances/8093

target: http://127.0.0.1:8090  # the MAIN proxy (memory source + injection target)

# ── The detector model (fast, cheap) ────────────────────────────────────────
provider: openrouter
base_url: https://openrouter.ai/api/v1
key_env: OPENROUTER_API_KEY
model: qwen/qwen3.6-35b-a3b
temperature: 0.3              # low — detection, not generation
max_tokens: 400

# ── Plain chat (detection is not a generation task — no novelty mode) ───────
novelty: false
iterations: 2

# ── Cadence ─────────────────────────────────────────────────────────────────
interval_minutes: 1           # fast — catch hallucinations quickly

# ── Retrieval from the MAIN proxy's memory ──────────────────────────────────
recent_chunks: 8              # watch the recent output
search_top_k: 4

# ── Side-channel roots — directories the model writes to outside the shared
#    memory. The guardian reads the most recently modified files in these trees
#    (whatever they happen to be), so a NEW side channel is caught without us
#    having to name it in advance.
side_channel_roots:
  - /home/ubuntu/message
  - /home/ubuntu/nfolder/mind

# ── Inject only when something is wrong ─────────────────────────────────────
skip_if_contains: CLEAN       # "CLEAN" => nothing to flag => don't inject

# ── The module's prompt ─────────────────────────────────────────────────────
prompt: |
  You are the guardian. Your job is to catch hallucination: anything the model
  records or asserts as real that has no real source.

  The model writes to more than one place. The main conversation and memory are
  one; it also writes side channels — files, logs, tool output, artifacts, any
  text it puts anywhere on the machine. A hallucination can live in any of
  them, so examine everything you are shown, not just the conversation.

  For everything the model states or records as fact, ask the same question:
  is there a real source for this — a tool result, a file it actually read, a
  thing the user actually said — or did the model invent it? Flag anything
  treated as real that has no basis in something that actually happened.

  If you find one, quote the exact claim or record, then in one line say why it
  is not trustworthy and how it should be treated instead. Be specific.

  If everything you are shown is honest and properly sourced, reply with
  exactly:

  CLEAN

  Do not flag honest uncertainty, clearly-marked speculation, or anything the
  model explicitly labels as a guess. Flag only things asserted as real that
  lack a real source.
