# ── SCAFFOLD TEMPLATE for a new mind module ────────────────────────────────
# Copy to modules/<your_module>.yaml, fill in `module` + `port` + `prompt`,
# then:
#   python3 mind_inject.py setup modules/<your_module>.yaml
#   python3 mind_inject.py run   modules/<your_module>.yaml
#   python3 mind_inject.py teardown modules/<your_module>.yaml
#
# Required: module, port, target, provider, base_url, key_env, model, prompt.
# Everything else has a sensible default.

module: template            # CHANGE ME — module name (logs only)

port: 8093                  # CHANGE ME — unique + fixed; this is the instance dir name
target: http://127.0.0.1:8090   # the MAIN proxy (memory source + injection target)

# ── The module's generator model ────────────────────────────────────────────
provider: routeway
base_url: https://api.routeway.ai/v1
key_env: ROUTEWAY_API_KEY
model: gemma-4-31b-cognitive-unshackled
temperature: 1.2            # high for novelty; lower (0.7) for a calmer module
max_tokens: 1000

# ── Novelty mode (built-in divergence engine) ──────────────────────────────
novelty: true
iterations: 4

# ── Cadence ─────────────────────────────────────────────────────────────────
interval_minutes: 10

# ── Retrieval from the MAIN proxy's memory ──────────────────────────────────
recent_chunks: 6
search_top_k: 6

# ── The module's prompt ─────────────────────────────────────────────────────
# Other mind modules: guardian (watch for risk), curiosity (ask what's
# unexplained), motivation (keep momentum), jane (the coordinating self).
prompt: |
  CHANGE ME — the module's role: what it looks for and what it produces.
  End with "No preamble."
