# ── Mind module: CREATIVE ──────────────────────────────────────────────────
# One module = one proxy instance (own port, own isolated DB, own model).
# The extension drives it: setup -> run -> teardown. Scaffold a new module by
# copying _TEMPLATE.yaml and changing `module` + `port` + `prompt`.

module: creative

# The module's proxy listens on this port. The port number IS the instance dir
# name (chunks/instances/<port>/) — keep it unique and FIXED.
port: 8092

# The MAIN proxy: whose memory we read, and whose thought flow we inject into.
target: http://127.0.0.1:8090

# ── The module's generator model (runs inside its own proxy) ───────────────
provider: routeway
base_url: https://api.routeway.ai/v1
key_env: ROUTEWAY_API_KEY
model: gemma-4-31b-cognitive-unshackled
temperature: 1.2            # high — creative novelty (models otherwise follow training)
max_tokens: 1000

# ── Novelty mode (POST /mode/think): diverge -> forbid -> measure -> judge ──
novelty: true               # use the built-in novelty engine instead of plain chat
iterations: 4               # number of divergent candidates it generates + judges

# ── Cadence ────────────────────────────────────────────────────────────────
interval_minutes: 10        # how often to tick

# ── Retrieval from the MAIN proxy's memory ─────────────────────────────────
recent_chunks: 6            # current state of mind (newest chunks)
search_top_k: 6             # similar OLDER chunks pulled by semantic search

# ── The module's prompt (the "mind function") ───────────────────────────────
prompt: |
  You are the drive to connect and make. You are handed the CURRENT state of
  mind and SIMILAR SITUATIONS from the past.

  Look at where things are now, find what it resembles in the past, and
  speculate on the FUTURE: will the current trajectory succeed, given how
  similar past situations turned out? If it will, say what to preserve. If it
  will not, that is the signal to invent — propose a genuinely new idea,
  connection, or image that breaks the failing pattern. The idea may be
  technical or artistic.

  Push past the obvious: do not restate the standard approach. Reach for the
  surprising thing that is still true. If you make an artifact worth keeping
  (a poem, a line, a picture in words, a design sketch), write it out in full.

  No preamble.
