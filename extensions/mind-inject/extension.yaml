# Mind-inject extension manifest — makes this extension manageable from the
# Mneme /extensions page (run / kill / log / config form).
#
# The extension is a CONTROL PLANE: each mind module (creative, guardian, ...)
# becomes its own proxy instance at chunks/instances/<port>/, driven through
# Mneme's novelty mode, and its output is injected into the main model's
# thought flow. One module = one YAML under modules/.

name: mind-inject
description: "Mind-module worker — one proxy per module (creative, guardian...), run through Mneme's novelty mode, and inject the output into the main model's thought flow"

command: ["python3", "mind_inject.py"]
args: ["run", "modules/creative.yaml"]

config:
  - key: MIND_INJECT_MODULE
    label: "Module"
    type: string
    required: false
    default: "creative"
    description: "Which module to run (matches a file under modules/, e.g. creative). The module's port, model, prompt, and cadence all live in that YAML."
